name: Bootstrap MILO source

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/part05.b64'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Restore verified site source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part{01..05}.b64 | base64 --decode > /tmp/milo-site.tar.xz
          echo "2e0a996b405fbcc18785a10794b3ba2bf1e982e7c6315e6a50cd4ec243acf657  /tmp/milo-site.tar.xz" | sha256sum --check
          tar -tJf /tmp/milo-site.tar.xz
          tar -xJf /tmp/milo-site.tar.xz
          test -s site/index.html
          test -s site/assets/styles.css
          node --check site/assets/app.js

      - name: Publish browsable source files to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git rm -r bootstrap
          git diff --cached --quiet && exit 0
          git commit -m "Publish MILO HTML, CSS and JavaScript source"
          git push origin HEAD:main
